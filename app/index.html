<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JP Fútbol · App</title>
<meta name="description" content="App de JP Fútbol para místers y familias: sesiones, asistencia, evolución de cada jugador y jugadora, tareas, vídeos y packs.">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JP Fútbol">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#050505;--g1:#0E0E0C;--g2:#161613;--g3:#1E1D19;--linea:#2A2822;--oro:#E2B746;--oro2:#F5CB64;--cal:#F8F6EF;--c2:#C9C4B6;--c3:#9A9588;--ok:#4CC38A;--warn:#F0A44B;--bad:#F06B5B;
--fd:"Oswald","Arial Narrow",sans-serif;--ft:"Manrope",system-ui,sans-serif;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
html[data-theme=light]{--noche:#ECEBE7;--g1:#FFFFFF;--g2:#F4F3EF;--g3:#E6E4DE;--linea:#DAD8D1;--oro:#E2B746;--oro2:#B8891F;--cal:#0B0B0A;--c2:#4F4B44;--c3:#7D786E;--ok:#1E8E5A;--warn:#B8650F;--bad:#C93B2C;color-scheme:light}
/* Versión clara: fondo gris cálido, tarjetas blancas y menús (lateral, barra superior e inferior) en negro con dorado */
html[data-theme=light] :is(.side,.topbar,.tabbar,#gate,.ccard,.phone,.player,.vthumb,.lpanel,.hero-card){--noche:#050505;--g1:#0E0E0C;--g2:#161613;--g3:#1E1D19;--linea:#2A2822;--oro:#E2B746;--oro2:#F5CB64;--cal:#F8F6EF;--c2:#C9C4B6;--c3:#9A9588;color-scheme:dark;color:var(--cal)}
.lthm{position:fixed;top:calc(14px + var(--st));right:14px;z-index:20}
.side .thm{display:flex;align-items:center;gap:12px}html[data-theme=light] .topbar{background:rgba(5,5,5,.94)}html[data-theme=light] .tabbar{background:rgba(10,10,9,.96);box-shadow:0 -6px 20px rgba(0,0,0,.12)}
html[data-theme=light] .bar,html[data-theme=light] .posplan .bar{background:#ECEBE7}html[data-theme=light] :is(.lib .lsearch,.newex){background:#fff}html[data-theme=light] .pvc .tg{background:#D2D0CA}
html[data-theme=light] .card,html[data-theme=light] section.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
html[data-theme=light] .ring b{background:#15130E}
html[data-theme=light] .chip{background:#FFFFFF;border-color:#D3D0C8;color:#2B2924;box-shadow:0 1px 2px rgba(0,0,0,.05)}html[data-theme=light] .chip .sub{color:#B8891F}
html[data-theme=light] .chip[aria-pressed=true]{background:#0B0B0A;border-color:#0B0B0A;color:#FFFFFF}html[data-theme=light] .chip[aria-pressed=true] .sub{color:#E2B746}
html[data-theme=light] .search{border-color:#D3D0C8}html[data-theme=light] .search:focus{outline:0;border-color:var(--oro);box-shadow:0 0 0 3px rgba(226,183,70,.28)}
.thm svg{width:18px;height:18px}.thm .sun{display:none}html[data-theme=light] .thm .sun{display:block}html[data-theme=light] .thm .moon{display:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--noche);color:var(--cal);font-family:var(--ft);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
#root{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--cal)}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:8px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.disp{font-family:var(--fd);text-transform:uppercase;font-weight:700;line-height:.95}
.muted{color:var(--c3)}
.gold{color:var(--oro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--linea);background:var(--g2);white-space:nowrap}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#130F05}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--g3);color:var(--c2)}
.pill.ok{background:rgba(76,195,138,.14);color:var(--ok)}.pill.warn{background:rgba(240,164,75,.14);color:var(--warn)}.pill.bad{background:rgba(240,107,91,.14);color:var(--bad)}.pill.gold{background:rgba(226,183,70,.14);color:var(--oro2)}

/* ---------- Acceso ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.lpanel{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px 24px;min-height:420px}
.lpanel .bg{position:absolute;inset:-30px;background:url(assets/campo.webp) center/cover;filter:blur(3px) brightness(.45) saturate(.9);animation:drift 40s linear infinite alternate}
@keyframes drift{from{transform:scale(1.08) translateX(-2%)}to{transform:scale(1.16) translateX(2%)}}
.lpanel .veil{position:absolute;inset:0;background:radial-gradient(50% 50% at 50% 45%,rgba(5,5,5,.15),rgba(5,5,5,.85))}
.seal{position:relative;width:min(300px,64vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.seal svg.r{position:absolute;inset:0;width:100%;height:100%}
.seal .r1{animation:spin 26s linear infinite}.seal .r2{animation:spin 9s linear infinite reverse}.seal .r3{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seal img{width:56%;border-radius:50%;box-shadow:0 0 0 2px rgba(226,183,70,.5),0 20px 60px rgba(0,0,0,.7)}
.lpanel h1{position:relative;font-size:clamp(34px,4.6vw,56px);text-align:center}
.lpanel p{position:relative;color:var(--c2);text-align:center;max-width:36ch}
.lform{display:flex;align-items:center;justify-content:center;padding:40px 24px calc(40px + var(--sb));background:var(--g1);border-left:1px solid var(--linea)}
.lform form{width:min(400px,100%)}
.lform h2{font-size:30px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--noche);border:1px solid var(--linea);margin:22px 0}
.seg button{min-height:44px;border-radius:10px;font-weight:700;color:var(--c3)}
.seg button[aria-pressed="true"]{background:var(--cal);color:var(--noche)}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label{font-weight:700;font-size:13.5px}
.f input,.f select,.f textarea{min-height:48px;border-radius:12px;border:1px solid var(--linea);background:var(--noche);padding:0 14px;font-size:16px}
.f textarea{padding:12px 14px;min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--oro)}
.demo{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(226,183,70,.08);border:1px solid rgba(226,183,70,.3);font-size:13.5px;color:var(--c2)}
.demo b{color:var(--oro2)}
@media (max-width:860px){.login{grid-template-columns:1fr}.lform{border-left:0;border-top:1px solid var(--linea)}.lpanel{min-height:56vh;padding-top:calc(30px + var(--st))}}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--linea);background:var(--g1);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .who{display:flex;align-items:center;gap:10px;padding:0 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--linea)}
.side .who img{width:42px;height:42px;border-radius:10px}
.side .who b{font-family:var(--fd);font-size:17px;text-transform:uppercase;letter-spacing:.04em;display:block;line-height:1.1}
.side .who span{font-size:12.5px;color:var(--c3)}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--c2);font-weight:600}
.side a.on{background:rgba(226,183,70,.12);color:var(--oro2)}
.side .end{margin-top:auto;display:grid;gap:6px}
.main{min-width:0;padding:26px clamp(16px,3vw,40px) calc(110px + var(--sb))}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;padding:calc(10px + var(--st)) 16px 10px;background:rgba(5,5,5,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--linea)}
  .topbar img{width:36px;height:36px;border-radius:9px}
  .topbar .t{font-family:var(--fd);text-transform:uppercase;font-size:18px;letter-spacing:.03em}
  .topbar .salir{color:#F06B5B;border-color:rgba(240,107,91,.45)}
  .topbar>div:last-child{gap:6px!important}.topbar .btn.sm{min-width:40px;padding:0 8px}
  @media (max-width:420px){.topbar [data-act=install]{display:none}.topbar .btn.sm{min-width:38px;min-height:38px;padding:0}.topbar .t{font-size:16px}.topbar img{width:32px;height:32px}}
  .main{padding:18px 16px calc(100px + var(--sb))}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,9,.94);backdrop-filter:blur(14px);border-top:1px solid var(--linea);padding:8px 6px calc(8px + var(--sb))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--c3);text-decoration:none;padding:4px 0}
  .tabbar a.on{color:var(--oro)}
}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;margin-bottom:20px}
.hd h1{font-size:clamp(30px,4vw,44px)}
.hd p{color:var(--c3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--g1);border:1px solid var(--linea);border-radius:18px;padding:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpi small{color:var(--c3);font-weight:600;font-size:13px}
.kpi b{display:block;font-family:var(--fd);font-size:38px;line-height:1.05;margin-top:4px}
.kpi span{font-size:12.5px;color:var(--c3)}
.hero-card{border-radius:22px;padding:20px;background:linear-gradient(135deg,#2B2410,#121210 60%);border:1px solid rgba(226,183,70,.35);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:70;width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(var(--oro) calc(var(--p)*1%),#2C2A24 0);display:flex;align-items:center;justify-content:center}
.ring b{width:78px;height:78px;border-radius:50%;background:#15130E;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);font-size:30px;line-height:1}
.ring b small{font-family:var(--ft);font-size:10px;color:var(--c3);font-weight:700}
.list{display:grid;gap:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:14.5px}
.item small{color:var(--c3);font-size:12.5px}
.av{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--g3);color:var(--oro2);border:1px solid var(--linea)}
.av.lg{width:64px;height:64px;border-radius:18px;font-size:22px}
.bar{height:8px;border-radius:99px;background:#24221D;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--oro),var(--oro2))}
.areas{display:grid;gap:12px}
.areas .row{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13.5px}
.areas .row b{text-align:right}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--linea);flex:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check.on{background:var(--oro);border-color:var(--oro);color:#130F05}
.check svg{width:16px;height:16px;stroke-width:3;opacity:0}
.check.on svg{opacity:1}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;min-height:44px;border-radius:12px;border:1px solid var(--linea);background:var(--g1);padding:0 14px;font-size:15px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--linea);font-weight:700;font-size:13px;color:var(--c2)}
.chip[aria-pressed="true"]{background:var(--cal);color:var(--noche);border-color:var(--cal)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vthumb{position:relative;aspect-ratio:9/14;border-radius:14px;overflow:hidden;border:1px solid var(--linea);text-align:left}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 55%)}
.vthumb span{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;font-weight:700;font-size:13px}
.vthumb i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;width:52px;height:52px;box-shadow:0 0 0 6px rgba(226,183,70,.25),0 8px 22px rgba(0,0,0,.5);border-radius:50%;background:var(--oro);color:#130F05;display:flex;align-items:center;justify-content:center}
.week{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.day h4{font-family:var(--fd);text-transform:uppercase;font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between}
.ses{border-radius:14px;padding:12px;background:var(--g2);border:1px solid var(--linea);margin-bottom:8px;text-align:left;width:100%}
.ses b{display:block;font-size:14px}
.ses small{color:var(--c3);font-size:12px}
.ses .tag{display:inline-block;margin-top:6px}
@media (max-width:900px){.week{grid-template-columns:repeat(4,minmax(200px,1fr));overflow-x:auto;padding-bottom:8px}}
.empty{padding:26px;text-align:center;color:var(--c3)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--c3);font-weight:700;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--linea)}
td{padding:12px 10px;border-bottom:1px solid var(--linea)}
.tw{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}

/* ---------- Hojas ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .box{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--g1);border:1px solid var(--linea);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + var(--sb));transform:translateY(30px);transition:transform .25s}
.sheet.open .box{transform:none}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:24px}}
.sheet h2{font-size:28px;margin-bottom:4px}
.sheet .x{float:right;width:40px;height:40px;border-radius:12px;background:var(--g3);display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translate(-50%,20px);z-index:90;background:var(--cal);color:var(--noche);font-weight:700;padding:12px 18px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pstep{display:flex;gap:6px;margin:0 40px 12px 0;flex-wrap:wrap}.pstep span{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c3,#777);padding:5px 9px;border-radius:999px;border:1px solid var(--linea)}.pstep span.on{color:#111;background:var(--oro);border-color:var(--oro)}
.psum{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px;padding:14px 16px;border-radius:14px;background:var(--noche);border:1px solid var(--linea)}.psum small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--oro)}.psum span{display:block;font-size:13px;color:var(--c2);margin-top:2px}.psum .amt{white-space:nowrap;font-family:var(--fd);font-size:34px;color:var(--oro2)}
.pico{display:grid;place-items:center;height:26px;margin-bottom:4px;color:var(--oro)}.pico svg{width:24px;height:24px}.pico.bz{font:800 15px/1 var(--fb,inherit);color:#05C3C8;letter-spacing:-.02em}
.psafe{text-align:center;font-size:12.5px;color:var(--c2);margin-top:12px}
.pback,.ptest{display:block;margin:10px auto 0;font-size:13.5px;font-weight:700;color:var(--oro);background:none;border:0;padding:8px}.ptest{border:1px dashed rgba(226,183,70,.5);border-radius:10px;width:100%;padding:11px}
.ccard{position:relative;aspect-ratio:1.586;max-width:340px;margin:12px auto 16px;border-radius:18px;padding:20px 22px;color:#F5EFDF;background:radial-gradient(120% 120% at 100% 0%,rgba(226,183,70,.55),transparent 55%),linear-gradient(135deg,#1c1a14,#050505 70%);border:1px solid rgba(226,183,70,.45);box-shadow:0 20px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.ccchip{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#E9CD7A,#9a7a1c)}.ccbrand{position:absolute;top:20px;right:22px;font-weight:900;font-style:italic;font-size:18px;letter-spacing:.02em}
.ccnum{font-family:ui-monospace,Menlo,monospace;font-size:clamp(17px,5vw,21px);letter-spacing:.08em}.ccrow{display:flex;justify-content:space-between;gap:10px}.ccrow small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}.ccrow b{font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;display:block}
#cf input:not([type=checkbox]){width:100%;box-sizing:border-box}
.pchk{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--c2);margin:4px 0 2px}.pchk input{width:18px;height:18px;accent-color:var(--oro)}
.bzin{display:flex;align-items:stretch;border:1px solid var(--linea);border-radius:12px;overflow:hidden;background:var(--noche)}.bzin span{display:grid;place-items:center;padding:0 12px;font-weight:800;color:var(--c2);border-right:1px solid var(--linea)}.bzin input{border:0!important;flex:1;min-width:0;background:transparent}
.pwait{text-align:center;padding:6px 0}.pwait p{font-size:14.5px;line-height:1.5;color:var(--c2);margin:16px 0 14px}

function todayName(){const d=new Date().getDay();return d>=1&&d<=4?DAYS[d-1]:'Lunes';}
/* Fecha del próximo día de la semana indicado (hoy incluido) */
function dateOf(dn){const x=new Date(),w=DAYS.indexOf(dn)+1;while(x.getDay()!==w)x.setDate(x.getDate()+1);return x;}
/* Portada con la foto de JP Fútbol en la primera pantalla de cada perfil */
function portada(k,t,s,acts){return `<section class="portada"><img src="assets/portada.webp" alt="" fetchpriority="high"><div class="po-in"><div class="po-k"><img src="assets/logo-round.webp" alt="JP Fútbol"><small>${k}</small></div><h1 class="disp">${t}</h1><p>${s}</p>${acts?`<div class="po-act">${acts}</div>`:''}</div></section>`;}
function nextTrainDate(){const x=new Date();while(x.getDay()<1||x.getDay()>4)x.setDate(x.getDate()+1);return x;}

/* ---------- Utilidades UI ---------- */
function toast(t){const el=$('#toast');el.innerHTML=I('check',18)+t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}
function sheet(html){$('#sheetBox').classList.remove('wide');$('#sheetBox').innerHTML=`<button class="x" data-close aria-label="Cerrar">${I('x')}</button>`+html;$('#sheet').classList.add('open');setTimeout(()=>$('#sheetBox [data-close]').focus(),40);}
function closeSheet(){$('#sheet').classList.remove('open');$$('#sheetBox video').forEach(v=>v.pause());}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function lineChart(vals,labels){
  const w=520,h=170,p=28,max=100,min=30,step=(w-p*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[p+i*step,h-p-(v-min)/(max-min)*(h-p*2)]);
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución de la nota global: de ${vals[0]} a ${vals[vals.length-1]}">
  <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B746" stop-opacity=".35"/><stop offset="1" stop-color="#E2B746" stop-opacity="0"/></linearGradient></defs>
  ${[40,60,80].map(v=>{const y=h-p-(v-min)/(max-min)*(h-p*2);return `<line x1="${p}" x2="${w-p}" y1="${y}" y2="${y}" stroke="#2A2822"/><text x="4" y="${y+4}" fill="#9A9588" font-size="11">${v}</text>`}).join('')}
  <path d="${d} L${pts[pts.length-1][0]} ${h-p} L${p} ${h-p}Z" fill="url(#ga)"/>
  <path d="${d}" fill="none" stroke="#E2B746" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?'#F5CB64':'#15130E'}" stroke="#E2B746" stroke-width="2"/><text x="${q[0]}" y="${h-6}" fill="#9A9588" font-size="11" text-anchor="middle">${labels[i]}</text>`).join('')}
  </svg>`;
}
const MONTHS=['May','Jun','Jul','Sep','Oct','Nov'];
const areasHTML=p=>`<div class="areas">${Object.entries(p.areas).map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}</div>`;
function playVideo(k,t){sheet(`<h2 class="disp">${t}</h2><p class="muted" style="margin-bottom:14px">Vídeo de la sesión</p><video class="player" src="${WEB}assets/vid/${k}.mp4" poster="${WEB}assets/img/poster-${k}.webp" controls playsinline autoplay></video>`);}
function videosHTML(){return `<div class="vgrid">${VIDEOS.map(v=>`<button class="vthumb" data-vid="${v.k}" data-t="${v.t}"><img loading="lazy" src="${WEB}assets/img/poster-${v.k}.webp" alt=""><i>${I('play',14)}</i><span>${v.t}</span></button>`).join('')}</div>`;}

/* ---------- Míster: Hoy ---------- */
const GOPEN=new Set();
function vHoy(){
  const day=todayName();
  const groups=Object.entries(GROUPS).filter(([k])=>onDay(k,day)||playersOn(k,day).length);
  const key=k=>day+'-'+k;
  const att=k=>S.attendance[key(k)]||[];
  const total=groups.reduce((a,[k])=>a+playersOn(k,day).length,0);
  const present=groups.reduce((a,[k])=>a+att(k).length,0);
  const pend=S.players.filter(p=>!p.paid).length;
  const tr=isTrainDay(),now=new Date(),nd=nextTrainDate();
  return `${portada('Equipo técnico','Entrena distinto.<br><span>Juega a otro nivel.</span>',`<span class="po-day">${DIAS[now.getDay()]}, ${fmtLong(now)}</span> · ${tr?'Día de entrenamiento':`Sin entrenamiento · Próxima sesión: <b>${day.toLowerCase()} ${fmtLong(nd)}</b>`}`,`<button class="btn" data-act="newAviso">${I('bell')}Enviar aviso</button><button class="btn oro" data-act="newSession">${I('plus')}Planificar sesión</button>`)}
  <div class="kstrip">
   <a href="#/sesiones" class="kst"><b>${groups.length}</b><small>${tr?'Grupos hoy':'Grupos el '+day.toLowerCase()}</small></a>
   <div class="kst"><b>${present}/${total}</b><small>Asistencia</small></div>
   <a href="#/jugadores" class="kst"><b>${S.players.length}</b><small>Jugadores activos</small></a>
   <a href="#/pagos" class="kst"><b class="${pend?'gold':''}">${pend}</b><small>Pagos pendientes</small></a>
  </div>
  ${sugHTML(day)}
  <h2 class="sech">${tr?'Grupos de hoy':'Grupos del '+day.toLowerCase()}<small>Toca un grupo para pasar lista</small></h2>
  <div class="grid g2 grps">${groups.map(([k,g])=>{const pl=playersOn(k,day),m=metaFor(k,day),n=att(k).length;return `<details class="card grp" ${GOPEN.has(k)?'open':''} ontoggle="GOPEN[this.open?'add':'delete']('${k}')"><summary><span class="gi"><b>${g.name}</b><small>${m.s} a ${m.e} · ${msTxt(m)}</small><span class="gbar"><i style="width:${pl.length?Math.round(n/pl.length*100):0}%"></i></span></span><span class="gn"><b>${n}/${pl.length}</b><small>presentes</small></span><span class="chev" aria-hidden="true">▾</span></summary>
   ${turnos(k).map(tt=>{const pt=pl.filter(p=>turnoOf(p,day,k)===tt);return `<div class="thd"><b>${turnoLbl(k,tt)}</b><span>${pt.length}/${frOf(k).cap} plazas</span></div><div class="list">${pt.map(p=>{const on=att(k).includes(p.id);return `<div class="item ${ciLevel(ciOf(p,day))==='away'?'away':''}">${av(p)}<div class="grow"><b>${p.name} ${camBadge(p)}</b><small>${p.age} años · ${p.pos}</small>${ciTag(p,day)}</div><button class="btn sm" data-open="${p.id}">Ficha</button><button class="check ${on?'on':''}" data-att="${key(k)}|${p.id}" aria-pressed="${on}" aria-label="Asistencia de ${p.name}">${I('check')}</button></div>`}).join('')||'<p class="muted" style="font-size:13px;padding:6px 0">Nadie en este turno.</p>'}</div>`}).join('')}

    fillGo(b,'del','Borrando…',()=>{if(S.plans)delete S.plans[key];if(S.meta)delete S.meta[key];save();closeSheet();render();toast(habitual?'Planificación borrada: vuelve el plan habitual':'Sesión borrada');});};}
/* Botón que se rellena poco a poco antes de confirmar: verde para confirmar, rojo para borrar. Tocar otra vez lo cancela. */
function fillGo(b,kind,txt,fn,ms){if(b.classList.contains('filled'))return;
  if(b.dataset.fill){clearTimeout(+b.dataset.fill);delete b.dataset.fill;b.classList.remove('filling','fok','fdel');b.innerHTML=b.dataset.orig;toast('Cancelado');return;}
  b.dataset.orig=b.innerHTML;b.style.setProperty('--fd',(ms||1200)+'ms');b.classList.add('filling',kind==='del'?'fdel':'fok');b.innerHTML=`${I(kind==='del'?'x':'check',16)}<span>${txt}</span>`;toast('Toca otra vez para cancelar');
  b.dataset.fill=setTimeout(()=>{delete b.dataset.fill;b.classList.add('filled');fn(b);},ms||1200);}

function payFlow(p){

  const back=`<button type="button" class="pback" id="pBack">← Cambiar forma de pago</button>`;

    <form id="cf" autocomplete="off" novalidate><div class="f"><label for="ch">Titular de la tarjeta</label><input id="ch" placeholder="Como aparece en la tarjeta"></div>

    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px"><div class="f"><label for="ce">Caducidad</label><input id="ce" inputmode="numeric" placeholder="MM/AA" maxlength="5"></div><div class="f"><label for="cv">CVC</label><input id="cv" inputmode="numeric" placeholder="123" maxlength="4"></div></div>
    <label class="pchk"><input type="checkbox" id="csv" checked> Usar esta tarjeta para los próximos meses</label>
    <p id="cfe" class="muted" style="color:var(--bad);min-height:18px;font-size:13px"></p>
    <button class="btn oro full">Pagar ${amt} €</button></form>
    <button type="button" class="ptest" id="cTest">Rellenar con tarjeta de prueba</button>${back}
    <p class="demo"><b>Demostración:</b> no se cobra nada ni se guarda ningún dato. Usa la tarjeta de prueba. En la versión real este paso lo hace la pasarela segura del banco (Redsys o Stripe).</p>`);
    const brand=v=>/^4/.test(v)?'VISA':/^(5[1-5]|2[2-7])/.test(v)?'Mastercard':'';
    const upd=()=>{const n=$('#cn').value.replace(/\D/g,'');$('#ccn').textContent=(n+'•'.repeat(Math.max(0,16-n.length))).replace(/(.{4})/g,'$1 ').trim();$('#ccb').textContent=brand(n);$('#cch').textContent=$('#ch').value.toUpperCase()||'NOMBRE APELLIDOS';$('#cce').textContent=$('#ce').value||'MM/AA';};

      if(!$('#ch').value.trim())err='Escribe el titular de la tarjeta.';else if(n.length<15)err='El número de tarjeta no está completo.';else if(!/^(0[1-9]|1[0-2])\/\d\d$/.test(e))err='La caducidad debe ser MM/AA.';else if(cv.length<3)err='El CVC tiene 3 cifras (detrás de la tarjeta).';

    <form id="bf" novalidate><div class="f"><label for="bp">Móvil asociado a Bizum</label><div class="bzin"><span>+34</span><input id="bp" inputmode="tel" placeholder="600 000 000" maxlength="11"></div></div>

    $('#bp').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,9).replace(/^(\d{3})(\d{1,3})?(\d{1,3})?$/,(a,x,y,z)=>[x,y,z].filter(Boolean).join(' '));};
    $('#pBack').onclick=step1;
    $('#bf').onsubmit=ev=>{ev.preventDefault();const n=$('#bp').value.replace(/\D/g,'');if(!/^[67]\d{8}$/.test(n)){$('#bfe').textContent='Escribe un móvil español de 9 cifras (empieza por 6 o 7).';return;}
      verify({type:'bizum',label:'Bizum ···· '+n.slice(-3),phone:n});};};
  const verify=(pm)=>{const bz=pm.type==='bizum';
    sheet(`${head(3,bz?'Acepta el Bizum':'Verificando el pago')}
    <div class="pwait"><div class="phone"><div class="pnot"><b>${bz?'Bizum':'Tu banco'}</b><span>${bz?'JP Fútbol te solicita':'Confirmar compra en'} ${bz?amt+'&nbsp;€':'JP FÚTBOL · '+amt+'&nbsp;€'}</span><div class="pbtns"><i>Rechazar</i><i class="ok">${bz?'Aceptar':'Confirmar'}</i></div></div></div>
    <p>${bz?`Hemos enviado la solicitud al <b>${pm.phone.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3')}</b>. Abre la app de tu banco y acéptala.`:'Tu banco puede pedirte que confirmes la compra en su app (seguridad 3D Secure).'}</p>
    <div class="pbar"><i id="pbar"></i></div><small class="muted" id="pst">Esperando confirmación…</small></div>
    <button class="btn full" id="pOk" style="margin-top:14px">${bz?'Ya lo he aceptado':'Ya lo he confirmado'}</button>`);
    let done=false;const fin=()=>{if(done)return;done=true;success(pm);};
    requestAnimationFrame(()=>{$('#pbar').style.width='100%';});
    const t=setTimeout(fin,4200);$('#pOk').onclick=()=>{clearTimeout(t);fin();};};
  const success=(pm)=>{const d=new Date();const r={n:'JP-'+d.getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000),d:d.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}),c:'Pack '+p.pack+' · '+mesActual(),m:pm.label,a:amt};
    p.paid=true;p.receipts=p.receipts||[];p.receipts.unshift(r);save();render();
    sheet(`<div class="pok"><div class="pokc">${I('check')}</div><h2 class="disp">Pago completado</h2><p class="muted">Gracias. ${p.name.split(' ')[0]} tiene el pack ${p.pack} activo este mes.</p></div>
    <div class="rcpt"><div><span>Recibo</span><b>${r.n}</b></div><div><span>Fecha</span><b>${r.d}</b></div><div><span>Concepto</span><b>${r.c}</b></div><div><span>Forma de pago</span><b>${r.m}</b></div><div class="tot"><span>Total</span><b>${r.a} €</b></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button class="btn" id="rDl">Descargar recibo</button><button class="btn oro" data-close>Hecho</button></div>`);
    $('#rDl').onclick=()=>dlReceipt(p,r);};
  step1();
}
function dlReceipt(p,r){const h=`<!doctype html><html lang="es"><meta charset="utf-8"><title>Recibo ${r.n}</title><body style="font-family:Arial,sans-serif;max-width:560px;margin:40px auto;color:#111"><h1 style="letter-spacing:.04em">JP FÚTBOL</h1><p style="color:#9a7a1c;font-weight:bold">Recibo de pago</p><table style="width:100%;border-collapse:collapse;margin-top:20px">${[['Nº de recibo',r.n],['Fecha',r.d],['Jugador/a',p.name],['Concepto',r.c],['Forma de pago',r.m],['Total',r.a+' €']].map(([a,b])=>`<tr><td style="padding:10px 0;border-bottom:1px solid #ddd;color:#666">${a}</td><td style="padding:10px 0;border-bottom:1px solid #ddd;text-align:right;font-weight:bold">${b}</td></tr>`).join('')}</table><p style="margin-top:30px;font-size:12px;color:#888">Documento de demostración · JP Fútbol · Centro Deportivo Valdezorras, Sevilla</p></body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='Recibo-'+r.n+'.html';document.body.appendChild(a);a.click();a.remove();toast('Recibo descargado');}

/* ---------- Vídeos personales (IndexedDB) ---------- */
const VDB={_db:null,open(){return this._db||(this._db=new Promise((ok,ko)=>{const r=indexedDB.open('jpfutbol-videos',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);}));},
  async put(id,b){const db=await this.open();return new Promise((ok,ko)=>{const tx=db.transaction('v','readwrite');tx.objectStore('v').put(b,id);tx.oncomplete=ok;tx.onerror=()=>ko(tx.error);});},
  async get(id){const db=await this.open();return new Promise((ok,ko)=>{const r=db.transaction('v').objectStore('v').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});},
  async del(id){const db=await this.open();return new Promise(ok=>{const tx=db.transaction('v','readwrite');tx.objectStore('v').delete(id);tx.oncomplete=ok;});}};
const URLS={};
async function pvURL(id){if(URLS[id])return URLS[id];const b=await VDB.get(id).catch(()=>null);if(!b)return null;return URLS[id]=URL.createObjectURL(b);}

  :`${can?'<p class="muted" style="font-size:14px">Todavía no hay vídeos.</p>':''}`}</section>`;}
function pvUpload(p){const fam=S.role!=='mister';
  sheet(`<h2 class="disp">Subir vídeo</h2><p class="muted" style="margin-bottom:16px">${fam?'Sube un vídeo de '+p.name.split(' ')[0]+' haciendo una tarea o un ejercicio en casa.':'Vídeo de '+p.name+' para su familia.'}</p>

const DSHORT=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function hnum(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function sessionHistory(p,weeks=4){const g=GROUPS[p.group];const now=new Date();now.setHours(0,0,0,0);const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const out=[];for(let w=0;w<weeks;w++){const ws=new Date(mon);ws.setDate(mon.getDate()-7*w);const items=[];
    const PSD=packSessions(p);DAYS.forEach((dn,i)=>{const ps=PSD.find(x=>x.dn===dn)||(S.meta&&S.meta[p.group+'|'+dn]&&{dn,k:p.group});if(!ps)return;const gk=ps.k;const d=new Date(ws);d.setDate(ws.getDate()+i);if(d>now)return;
      const key=dn+'-'+gk;const today=+d===+now;let st;
      if(today)st=(S.attendance[key]||[]).includes(p.id)?'si':'hoy';else st=(hnum(p.id+d.toDateString())%100)<p.att?'si':'no';
      const L=libFor(gk,'Todos','').filter(x=>gk==='por'||gk==='fis'||(x.a!=='Porteros'&&x.a!=='Físico'));const plan=(today&&planFor(gk,dn))||(()=>{const h=hnum(p.group+d.toDateString());return [0,1,2].map(j=>L[(h+j*7)%L.length]&&L[(h+j*7)%L.length].n).filter(Boolean);})();
      items.push({d,dn,st,k:gk,m:metaFor(gk,dn),t:turnoLbl(gk,turnoOf(p,dn,gk)),ex:plan});});
    if(items.length)out.push({ws,items:items.reverse()});}
  return out;}
function historyHTML(p){const H=sessionHistory(p);const all=H.flatMap(w=>w.items).filter(x=>x.st!=='hoy');const si=all.filter(x=>x.st==='si').length;
  const we=d=>{const e=new Date(d);e.setDate(d.getDate()+3);return d.getMonth()===e.getMonth()?`${d.getDate()} al ${e.getDate()} de ${MESES[e.getMonth()]}`:`${d.getDate()} ${MESES[d.getMonth()].slice(0,3)} al ${e.getDate()} ${MESES[e.getMonth()].slice(0,3)}`;};
  return `<section class="card" style="margin-bottom:14px"><h3>Historial de sesiones <span class="pill gold">${si} de ${all.length} sesiones</span></h3>
  ${H.map((w,i)=>`<div class="hweek"><h4>${i===0?'Esta semana':i===1?'Semana pasada':'Semana del '+we(w.ws)}<small>${i<2?we(w.ws):''}</small></h4>${w.items.map(x=>`<div class="hses ${x.st}"><div class="hd8"><b>${x.d.getDate()}</b><small>${DSHORT[x.d.getDay()]}</small></div><div class="grow"><div class="hrow"><b>${GROUPS[x.k].short||GROUPS[x.k].name}<small class="hname">${p.name}</small></b><span class="pill ${x.st==='si'?'ok':x.st==='no'?'warn':'gold'}">${x.st==='si'?'Asistió':x.st==='no'?'No asistió':'Hoy'}</span></div><small>${x.t} · ${msTxt(x.m)}</small>${x.st!=='no'?`<div class="hex">${x.ex.map(e=>`<span>${e}</span>`).join('')}</div>`:''}</div></div>`).join('')}</div>`).join('')}</section>`;}

  <p class="battx">Son <b>pruebas de medición</b>, no ejercicios de la sesión. Cada 2 o 3 meses se repiten, se apuntan con el botón <b>Medir</b> de cada jugador o jugadora y la app compara el antes y el después. La familia ve la evolución en su <b>Progreso</b>. Para mejorar cada prueba, toca «Ejercicios para mejorarla».</p>

  ${top.length?`<section class="card" style="margin-bottom:14px"><h3>Los que más mejoran</h3><div class="list">${top.map((p,i)=>`<div class="item" style="cursor:pointer" data-open="${p.id}"><span class="rk">${i+1}</span>${av(p)}<div class="grow"><b>${p.name}</b><small>${GROUPS[p.group].short||GROUPS[p.group].name} · ${p.age} años</small></div><span class="pill ok">▲ ${fmtN(avgImp(p),1)} %</span></div>`).join('')}</div></section>`:''}

  <div class="card"><div class="list">${L.map(p=>{const R=testRows(p),m=R.filter(r=>r.a&&r.b&&r.a!==r.b),up=m.filter(r=>r.pct>=0.5).length,ld=lastTest(p);
    return `<div class="item">${av(p)}<div class="grow" style="cursor:pointer" data-open="${p.id}"><b>${p.name}</b><small>${ld?'Medido el '+fmtD(ld)+(lastBy(p)?' por míster '+lastBy(p):''):'Sin medir'} · ${R.length} pruebas para su edad</small></div>${m.length?`<span class="pill ${up>=m.length/2?'ok':'warn'}">Mejora en ${up} de ${m.length}</span>`:''}<button class="btn sm" data-act="measure" data-id="${p.id}">Medir</button></div>`}).join('')||'<p class="empty">No hay jugadores en este grupo.</p>'}</div></div>`;}

/* ---------- Sugerencias del día (Hoy) ---------- */
let SUGO=false;
function sugHTML(day){const off=(S.sugOff&&S.sugOff[day])||[],L=[],seen=new Set(),pl=[];
  Object.keys(GROUPS).forEach(k=>playersOn(k,day).forEach(p=>{if(!seen.has(p.id)){seen.add(p.id);pl.push(p);}}));
  pl.forEach(p=>{const c=ciOf(p,day),lv=ciLevel(c);
    if(lv==='bad')L.push({k:'b'+p.id,ty:'bad',ic:'🩹',t:`${nm(p)} llega con molestias`,s:(c.nota?esc(c.nota):'Lo ha avisado su familia')+'. Valóralo antes de empezar.',b:`<button class="btn sm" data-open="${p.id}">Ficha</button>`});
    else if(lv==='away')L.push({k:'a'+p.id,ty:'warn',ic:'🚫',t:`${nm(p)} no viene hoy`,s:c.why+(c.nota?' · '+esc(c.nota):''),b:''});
    else if(lv==='mid')L.push({k:'m'+p.id,ty:'warn',ic:c.d===2?'🩹':c.s===1?'😴':'🔋',t:`${nm(p)} ${c.d===2?'tiene alguna molestia':c.s===1?'ha dormido mal':'llega con poca energía'}`,s:(c.nota?esc(c.nota)+'. ':'')+'Mejor bajar un poco la intensidad.',b:''});});
  const sin=pl.filter(p=>!ciOf(p,day));if(sin.length)L.push({k:'sin',ty:'',ic:'⏳',t:`${sin.length===1?'1 familia no ha dicho':sin.length+' familias no han dicho'} cómo llegan`,s:sin.map(nm).join(', '),b:`<button class="btn sm" data-act="ciRemind" data-n="${sin.length}">Recordar</button>`});
  S.players.filter(p=>{const h=sessionHistory(p,3).flatMap(w=>w.items).filter(x=>x.st!=='hoy');return h.length>1&&h[0].st==='no'&&h[1].st==='no';}).slice(0,2).forEach(p=>L.push({k:'f'+p.id,ty:'warn',ic:'📉',t:`${nm(p)} ha faltado a las 2 últimas sesiones`,s:'Escribe a su familia para saber si todo va bien.',b:`<button class="btn sm" data-act="note" data-id="${p.id}">Escribir</button>`}));
  const best=[...S.players].sort((a,b)=>(avgImp(b)||0)-(avgImp(a)||0))[0];if(best&&avgImp(best)>0)L.push({k:'best'+best.id,ty:'ok',ic:'⭐',t:`${nm(best)} es quien más ha mejorado`,s:`Sus pruebas físicas suben un ${fmtN(avgImp(best),1)} % de media. Cuéntaselo a su familia.`,b:`<button class="btn sm" data-act="note" data-id="${best.id}" data-pre="¡Enhorabuena! ${nm(best)} es quien más ha mejorado en las pruebas físicas este trimestre. Se nota el trabajo de cada sesión. ¡A seguir así!">Felicitar</button>`});
  const pend=S.players.filter(p=>!p.paid);if(pend.length)L.push({k:'pay',ty:'',ic:'💳',t:`${pend.length===1?'1 pago pendiente':pend.length+' pagos pendientes'}`,s:pend.map(nm).join(', '),b:'<button class="btn sm" data-act="go" data-to="pagos">Ver pagos</button>'});
  const noA=S.players.filter(p=>!au(p).ind);if(noA.length)L.push({k:'auth',ty:'',ic:'🎥',t:`Falta la autorización de vídeo de ${noA.length===1?nm(noA[0]):noA.length+' jugadores'}`,s:noA.length===1?'Sin ella no se le pueden grabar vídeos individuales.':noA.map(nm).join(', '),b:'<button class="btn sm" data-act="remind">Recordar</button>'});
  const old=S.players.filter(p=>!lastTest(p)||Date.now()-lastTest(p)>60*864e5);if(old.length)L.push({k:'tst',ty:'',ic:'⏱️',t:`Toca medir a ${old.length===1?nm(old[0]):old.length+' jugadores'}`,s:'Hace más de 2 meses de sus últimas pruebas físicas, o aún no las tiene.',b:'<button class="btn sm" data-act="go" data-to="pruebas">Pruebas</button>'});
  const V=L.filter(x=>!off.includes(x.k));if(!V.length)return '';
  return `<details class="card sug" style="margin-bottom:14px" ${SUGO?'open':''} ontoggle="SUGO=this.open"><summary><span class="sgt"><b>Sugerencias del día <span class="pill gold">${V.length}</span></b><small class="s-c">${V[0].ic} ${V[0].t}${V.length>1?` · y ${V.length-1} más`:''}</small><small class="s-o">Lo importante antes de empezar</small></span><span class="chev" aria-hidden="true">▾</span></summary><div>${V.map(x=>`<div class="sgi ${x.ty}"><span class="ic">${x.ic}</span><div class="grow"><b>${x.t}</b><small>${x.s}</small></div>${x.b}<button class="sx" data-act="sugX" data-k="${x.k}" aria-label="Ocultar sugerencia">${I('x',16)}</button></div>`).join('')}</div></details>`;}

/* ---------- Informe para la familia ---------- */
function reportText(p){const g=GROUPS[p.group],ar=Object.entries(p.areas).sort((a,b)=>b[1]-a[1]),R=testRows(p).filter(r=>r.a),done=p.tasks.filter(t=>t.done).length,nt=p.notes[0],dif=p.hist[5]-p.hist[0];
  return [`⚽ JP Fútbol · Informe de ${p.name}`,`${g.name} · ${mesActual()}`,'',
  `📅 Asistencia: ${p.att} % (${p.sessions} sesiones esta temporada)`,
  `⭐ Nota global: ${score(p)} de 100 (${dif>=0?'+':''}${dif} desde mayo)`,
  `📊 Por áreas: ${Object.entries(p.areas).map(([k,v])=>k+' '+v).join(' · ')}`,
  `💪 Punto fuerte: ${ar[0][0]} · 🎯 A mejorar: ${ar[ar.length-1][0]}`,
  ...(R.length?['','⏱️ Pruebas físicas (antes → ahora):',...R.map(r=>{const two=r.b&&r.b!==r.a;return `• ${r.t.n}: ${two?fmtN(r.b.v,r.t.dec)+' → ':''}${fmtN(r.a.v,r.t.dec)} ${r.t.u}${two?` (${r.pct>=0.5?'mejora un '+fmtN(r.pct,1)+' %':r.pct<=-0.5?'baja un '+fmtN(-r.pct,1)+' %':'igual'})`:''}`;})]:[]),
  '',`🏠 Tareas para casa: ${done} de ${p.tasks.length} hechas`,
  ...(nt?['',`💬 Míster ${nt.by}: «${nt.t}»`]:[]),
  '','¡Gracias por confiar en JP Fútbol!','Equipo técnico'].join('\n');}
function reportSheet(p){const tx=reportText(p),fam=S.role!=='mister';
  sheet(`<h2 class="disp">Informe de ${nm(p)}</h2><p class="muted" style="margin-bottom:14px">${fam?'Resumen del equipo técnico':'Listo para mandar a la familia por WhatsApp'}</p><div class="rep">${esc(tx)}</div>
  <div class="repb"><button class="btn" id="rpCp">Copiar</button>${fam?'':`<a class="btn oro" href="https://wa.me/?text=${encodeURIComponent(tx)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>`}${navigator.share?'<button class="btn" id="rpSh">Compartir</button>':''}</div>`);
  $('#rpCp').onclick=async()=>{try{await navigator.clipboard.writeText(tx);toast('Informe copiado');}catch(e){toast('Selecciona el texto y cópialo');}};
  const sh=$('#rpSh');if(sh)sh.onclick=()=>navigator.share({title:'Informe de '+p.name,text:tx}).catch(()=>{});}

/* ---------- Comentarios del míster en el segundo exacto del vídeo ---------- */
const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const cmList=v=>(v.c||[]).slice().sort((a,b)=>a.t-b.t).map(c=>`<button class="cmi" data-t="${c.t}"><b>${fmtT(c.t)}</b><span>${esc(c.txt)}<small>Míster ${c.by} · toca para verlo</small></span></button>`).join('')||'<p class="muted" style="font-size:13px">Todavía no hay comentarios.</p>';
function pvCm(p,v){const mi=S.role==='mister';if(!(v.c||[]).length&&!mi)return '';
  return `<div class="cmt"><div class="cmbar" id="cmbar"><span class="now" id="cmnow"></span></div><div class="cml" id="cml">${cmList(v)}</div>
  ${mi?`<form id="cmf" class="cmf"><span class="cmt0" id="cmt0">0:00</span><input id="cmx" placeholder="Corrección en este segundo" maxlength="160" aria-label="Comentario en este segundo del vídeo"><button class="btn sm oro">Añadir</button></form><small class="muted" style="font-size:12px">Para el vídeo donde quieras corregir y escribe: el comentario queda en ese segundo.</small>`:''}</div>`;}
function pvWire(p,v){const vd=$('#sheetBox video.player');if(!vd||!$('#cml'))return;
  const marks=()=>{const d=vd.duration;$$('#cmbar i').forEach(x=>x.remove());if(!(d>0))return;(v.c||[]).forEach(c=>{const i=document.createElement('i');i.style.left=Math.min(100,c.t/d*100)+'%';i.title=fmtT(c.t);i.onclick=()=>{vd.currentTime=c.t;vd.play();};$('#cmbar').appendChild(i);});};
  vd.addEventListener('loadedmetadata',marks);if(vd.readyState>=1)marks();
  vd.addEventListener('timeupdate',()=>{const t=vd.currentTime,d=vd.duration;if($('#cmt0'))$('#cmt0').textContent=fmtT(t);if(d>0&&$('#cmnow'))$('#cmnow').style.width=(t/d*100)+'%';$$('#cml .cmi').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.t-t)<1.2));});
  $('#cml').onclick=e=>{const b=e.target.closest('.cmi');if(!b)return;vd.currentTime=+b.dataset.t;vd.play();};
  const f=$('#cmf');if(!f)return;$('#cmx').onfocus=()=>vd.pause();
  f.onsubmit=ev=>{ev.preventDefault();const tx=$('#cmx').value.trim();if(!tx)return;const t=+vd.currentTime.toFixed(1);v.c=v.c||[];v.c.push({t,txt:tx,by:S.me});save();$('#cml').innerHTML=cmList(v);marks();$('#cmx').value='';rerender();toast('Comentario guardado en el '+fmtT(t));};}

/* ---------- Cuadrante semanal en cuadrícula (días × grupos) ---------- */
const GCOL={preb:'#4CC38A',benj:'#5AA9F0',alev:'#E2B746',infa:'#F0A44B',cade:'#F06B5B',juv:'#B07CF0',fis:'#3FC9C9',por:'#9A9588'};

function cuadGrid(){const td=todayName();cgDay=cgDay||td;const has=(k,d)=>onDay(k,d)||playersOn(k,d).length;const off=d=>d===cgDay?'':' off';const G=Object.entries(GROUPS).filter(([k])=>DAYS.some(d=>onDay(k,d)||playersOn(k,d).length));

    <ul>${ex.slice(0,2).map(x=>`<li>${esc(x)}</li>`).join('')}${ex.length>2?`<li class="more">+${ex.length-2} más</li>`:''}</ul>

/* ---------- Sesiones de la semana: calendario con franja horaria ---------- */
let sDay=null;
function sesCal(){const td=todayName();sDay=sDay||td;const ev={};let mn=24*60,mx=0;
  DAYS.forEach(d=>{ev[d]=Object.entries(GROUPS).filter(([k])=>onDay(k,d)||playersOn(k,d).length).map(([k,g])=>{const m=metaFor(k,d),s=tmin(m.s),e=tmin(m.e);mn=Math.min(mn,s);mx=Math.max(mx,e);return {k,g,m,s,e,d};}).sort((a,b)=>a.s-b.s);});
  const Q=15,st=Math.min(18*60,Math.floor((mn-60)/60)*60),en=Math.max(22*60,Math.ceil((mx+30)/60)*60),rows=(en-st)/Q,row=t=>Math.round((t-st)/Q)+2;
  const card=x=>{const pl=playersOn(x.k,x.d),T=turnos(x.k),cap=frOf(x.k).cap*T.length,away=pl.filter(p=>ciLevel(ciOf(p,x.d))==='away').length,own=planFor(x.k,x.d);
    return `<button class="sc-ev" data-group="${x.k}" data-day="${x.d}" style="--gc:${GCOL[x.k]||'var(--oro)'}" title="${x.g.name} · ${x.m.s}–${x.m.e} · ${msTxt(x.m)}"><b>${x.g.short||x.g.name}</b><em>${x.g.sub||''}</em><small>${msTxt(x.m).replace(/^Míster(s)? /,'')} · ${pl.length}/${cap}${T.length>1?' · '+T.length+' turnos':''}</small>${away?`<i class="sc-aw" title="${away} no ${away===1?'viene':'vienen'} (avisó la familia)">${away} no ${away===1?'viene':'vienen'}</i>`:''}${own?'<i class="sc-ok" title="Sesión planificada">✓</i>':''}</button>`;};
  const clusters=d=>{const C=[];ev[d].forEach(x=>{const c=C[C.length-1];if(c&&x.s<c.e){c.e=Math.max(c.e,x.e);c.L.push(x);}else C.push({s:x.s,e:x.e,L:[x]});});return C;};
  const cuts=c=>{const S=new Set();c.L.forEach(x=>turnos(x.k).forEach(t=>{const m=tmin(t);if(m>c.s&&m<c.e)S.add(m);}));return [...S].map(m=>`<i class="sc-cut" style="top:${(m-c.s)/(c.e-c.s)*100}%"><span>${hm(m)}</span></i>`).join('');};
  let h=`<div class="sc-days">${DAYS.map(d=>`<button class="chip" data-act="sDay" data-d="${d}" aria-pressed="${d===sDay}">${d}${d===td?' · hoy':''}</button>`).join('')}</div>
  <div class="sc"><div class="sc-corner"></div>${DAYS.map((d,i)=>`<div class="sc-dh${d===td?' td':''}${d===sDay?'':' off'}" style="grid-column:${i+2}"><b>${d}</b>${d===td?'<span class="pill gold">Hoy</span>':''}<small>${ev[d].length} ${ev[d].length===1?'sesión':'sesiones'}</small></div>`).join('')}`;
  for(let r=0;r<rows;r++){const t=st+r*Q,q=t%60===0?'h':t%30===0?'m':'q';h+=`<div class="sc-t ${q}" style="grid-row:${r+2}">${hm(t)}</div>`;DAYS.forEach((d,i)=>{h+=`<button class="sc-slot ${q}${d===td?' td':''}${d===sDay?'':' off'}" style="grid-row:${r+2};grid-column:${i+2}" data-act="planDay" data-d="${d}" aria-label="Planificar el ${d.toLowerCase()} a las ${hm(t)}"></button>`;});}
  DAYS.forEach((d,i)=>clusters(d).forEach(c=>{h+=`<div class="sc-cl${d===sDay?'':' off'}" style="grid-row:${row(c.s)}/${row(c.e)};grid-column:${i+2}">${c.L.map(card).join('')}${cuts(c)}</div>`;}));
  return h+'</div>';}

    $('#nxb').onclick=()=>{$('#nx').hidden=false;$('#nxb').hidden=true;$('#nxn').focus();};
    $('#nxx').onclick=()=>{$('#nx').hidden=true;$('#nxb').hidden=false;$('#nxe').textContent='';};
    $('#nxs').onclick=()=>{const n=$('#nxn').value.trim(),mm=+$('#nxm').value||10;if(!n){$('#nxe').textContent='Escribe el nombre del ejercicio.';return;}if(allLib().some(x=>x.n.toLowerCase()===n.toLowerCase())){$('#nxe').textContent='Ya existe un ejercicio con ese nombre.';return;}
      const g=$('#sg').value;const cats=$('#nxc').value==='all'?'PBAIC':(CATL[g]||'PBAIC');
      S.customEx=S.customEx||[];S.customEx.unshift({a:$('#nxa').value,c:cats,m:Math.min(90,Math.max(1,mm)),n,d:$('#nxd').value.trim(),t:$('#nxt').value,o:$('#nxo').value.trim(),k:$('#nxk').value.split(/\n/).map(s=>s.trim()).filter(Boolean),own:true,by:S.me||'',g:$('#nxc').value==='all'?'all':g});save();
      sel=[...sel,n];['#nxn','#nxd','#nxo','#nxk'].forEach(x=>$(x).value='');$('#nxm').value='10';$('#nx').hidden=true;$('#nxb').hidden=false;$('#nxe').textContent='';
      area='Del club';$$('#sareas .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.area===area));draw();toast('Ejercicio guardado en la biblioteca');};

    $('#slist').onclick=e=>{const fi=e.target.closest('[data-info]');if(fi){exSheet(fi.dataset.info);return;}const b=e.target.closest('[data-ex]');if(!b)return;const n=b.dataset.ex;const on=!sel.includes(n);sel=on?[...sel,n]:sel.filter(x=>x!==n);b.classList.toggle('on',on);b.querySelector('.add').textContent=on?'✓':'+';drawSel();};
    $('#ssel').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;sel.splice(+b.dataset.rm,1);draw();};
    load();
    $('#sf').onsubmit=ev=>{ev.preventDefault();const extra=$('#se').value.split('\n').map(x=>x.trim()).filter(Boolean);const all=[...sel,...extra];if(!all.length){toast('Añade al menos un ejercicio');return;}if(!ms.length){$('#sme').textContent='Elige al menos un míster.';$('#smp').scrollIntoView({block:'center',behavior:'smooth'});return;}if(tmin($('#sh2').value)<=tmin($('#sh1').value)){toast('La hora de fin debe ser posterior a la de inicio');return;}S.plans=S.plans||{};S.plans[$('#sg').value+'|'+$('#sd').value]=all;S.meta=S.meta||{};S.meta[$('#sg').value+'|'+$('#sd').value]={ms,s:$('#sh1').value,e:$('#sh2').value};save();closeSheet();render();toast('Sesión planificada');};}
  if(a==='newPlayer'){newPlayerSheet();}
  if(a==='pay'){payFlow(P(S.kid));}
  if(a==='theme'){e.preventDefault();toggleTheme();return;}
  if(a==='avisos'){avSheet();return;}
  if(a==='help'){helpSheet(t.dataset.tab);return;}
  if(a==='ajustes'){ajustesSheet();return;}
  if(a==='newAviso'){newAviso();return;}
  if(a==='install'){e.preventDefault();installApp();return;}
  if(a==='mvg'){if(!SOCIOS.includes(S.me))return;const C=cuad(),k=t.dataset.g2;C.g[k]=(C.g[k]||'may')==='peq'?'may':'peq';save();rerender();toast((GROUPS[k].short||GROUPS[k].name)+' pasa a la franja '+C.fr[C.g[k]].n);return;}
  if(a==='cday'){cDay=t.dataset.d;rerender();return;}
  if(a==='pickT'){const p=P(S.kid);p.turnos=p.turnos||{};p.turnos[t.dataset.k+'|'+t.dataset.d]=t.dataset.t;save();rerender();toast(`${p.name.split(' ')[0]} irá el ${t.dataset.d.toLowerCase()} de ${turnoLbl(t.dataset.k,t.dataset.t)}`);return;}
  if(a==='pvup'){pvUpload(P(t.dataset.id));return;}
  if(a==='pvplay'){pvPlay(P(t.dataset.id),t.dataset.v);return;}
  if(a==='auth'){authSheet(P(S.kid));return;}
  if(a==='rcpt'){const p=P(S.kid);dlReceipt(p,p.receipts[+t.dataset.i]);}
  if(a==='changePack'){const p=P(S.kid),n=t.dataset.pack,from=nextMonth1();
    sheet(`<h2 class="disp">Cambiar a ${n}</h2><p class="muted" style="margin-bottom:16px">${p.name}</p>
    <div class="pchg"><div><small>Este mes</small><b>${p.pack}</b><span>${PACKS[p.pack]} € · ${PACKINFO[p.pack].d}<br>${daysTxt(packSessions(p))}</span></div><i>→</i><div class="to"><small>Desde el ${fmtLong(from)}</small><b>${n}</b><span>${PACKS[n]} € · ${PACKINFO[n].d}<br>${daysTxt(packSessions(p,n))}</span></div></div>
    <p class="demo" style="margin-top:14px">${I('lock',14)} Para evitar confusiones con las sesiones y los pagos, el pack no se cambia a mitad de mes. El nuevo pack empieza el <b>${fmtLong(from)}</b> y ese mes se paga ya con el precio nuevo. Puedes cancelar el cambio antes de esa fecha.</p>
    <button class="btn oro full" id="pkGo" style="margin-top:14px">Programar cambio para el ${fmtLong(from)}</button>`);
    $('#pkGo').onclick=()=>{p.nextPack={pack:n,from:from.toISOString(),asked:new Date().toISOString()};save();closeSheet();render();toast('Cambio a '+n+' programado para el '+fmtLong(from));};return;}
  if(a==='cancelPack'){const p=P(S.kid);delete p.nextPack;save();render();toast('Cambio de pack cancelado');return;}
});

render();

document.addEventListener('change',e=>{const inp=e.target.closest('[data-photo]');if(!inp||!inp.files[0])return;const p=P(inp.dataset.photo);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const W=360,H=450,c=document.createElement('canvas');c.width=W;c.height=H;const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);p.photo=c.toDataURL('image/jpeg',.82);save();render();toast('Foto guardada');};im.src=fr.result;};fr.readAsDataURL(inp.files[0]);});
</script>
