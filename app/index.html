<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JP Fútbol · App</title>
<meta name="description" content="App de JP Fútbol para místers y familias: sesiones, asistencia, evolución de cada jugador y jugadora, tareas, vídeos y packs.">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JP Fútbol">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#050505;--g1:#0E0E0C;--g2:#161613;--g3:#1E1D19;--linea:#2A2822;--oro:#E2B746;--oro2:#F5CB64;--cal:#F8F6EF;--c2:#C9C4B6;--c3:#9A9588;--ok:#4CC38A;--warn:#F0A44B;--bad:#F06B5B;
--fd:"Oswald","Arial Narrow",sans-serif;--ft:"Manrope",system-ui,sans-serif;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--noche);color:var(--cal);font-family:var(--ft);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
#root{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--cal)}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:8px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.disp{font-family:var(--fd);text-transform:uppercase;font-weight:700;line-height:.95}
.muted{color:var(--c3)}
.gold{color:var(--oro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--linea);background:var(--g2);white-space:nowrap}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#130F05}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--g3);color:var(--c2)}
.pill.ok{background:rgba(76,195,138,.14);color:var(--ok)}.pill.warn{background:rgba(240,164,75,.14);color:var(--warn)}.pill.bad{background:rgba(240,107,91,.14);color:var(--bad)}.pill.gold{background:rgba(226,183,70,.14);color:var(--oro2)}

/* ---------- Acceso ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.lpanel{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px 24px;min-height:420px}
.lpanel .bg{position:absolute;inset:-30px;background:url(assets/campo.webp) center/cover;filter:blur(3px) brightness(.45) saturate(.9);animation:drift 40s linear infinite alternate}
@keyframes drift{from{transform:scale(1.08) translateX(-2%)}to{transform:scale(1.16) translateX(2%)}}
.lpanel .veil{position:absolute;inset:0;background:radial-gradient(50% 50% at 50% 45%,rgba(5,5,5,.15),rgba(5,5,5,.85))}
.seal{position:relative;width:min(300px,64vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.seal svg.r{position:absolute;inset:0;width:100%;height:100%}
.seal .r1{animation:spin 26s linear infinite}.seal .r2{animation:spin 9s linear infinite reverse}.seal .r3{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seal img{width:56%;border-radius:50%;box-shadow:0 0 0 2px rgba(226,183,70,.5),0 20px 60px rgba(0,0,0,.7)}
.lpanel h1{position:relative;font-size:clamp(34px,4.6vw,56px);text-align:center}
.lpanel p{position:relative;color:var(--c2);text-align:center;max-width:36ch}
.lform{display:flex;align-items:center;justify-content:center;padding:40px 24px calc(40px + var(--sb));background:var(--g1);border-left:1px solid var(--linea)}
.lform form{width:min(400px,100%)}
.lform h2{font-size:30px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--noche);border:1px solid var(--linea);margin:22px 0}
.seg button{min-height:44px;border-radius:10px;font-weight:700;color:var(--c3)}
.seg button[aria-pressed="true"]{background:var(--cal);color:var(--noche)}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label{font-weight:700;font-size:13.5px}
.f input,.f select,.f textarea{min-height:48px;border-radius:12px;border:1px solid var(--linea);background:var(--noche);padding:0 14px;font-size:16px}
.f textarea{padding:12px 14px;min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--oro)}
.demo{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(226,183,70,.08);border:1px solid rgba(226,183,70,.3);font-size:13.5px;color:var(--c2)}
.demo b{color:var(--oro2)}
@media (max-width:860px){.login{grid-template-columns:1fr}.lform{border-left:0;border-top:1px solid var(--linea)}.lpanel{min-height:56vh;padding-top:calc(30px + var(--st))}}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--linea);background:var(--g1);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .who{display:flex;align-items:center;gap:10px;padding:0 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--linea)}
.side .who img{width:42px;height:42px;border-radius:10px}
.side .who b{font-family:var(--fd);font-size:17px;text-transform:uppercase;letter-spacing:.04em;display:block;line-height:1.1}
.side .who span{font-size:12.5px;color:var(--c3)}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--c2);font-weight:600}
.side a.on{background:rgba(226,183,70,.12);color:var(--oro2)}
.side .end{margin-top:auto;display:grid;gap:6px}
.main{min-width:0;padding:26px clamp(16px,3vw,40px) calc(110px + var(--sb))}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;padding:calc(10px + var(--st)) 16px 10px;background:rgba(5,5,5,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--linea)}
  .topbar img{width:36px;height:36px;border-radius:9px}
  .topbar .t{font-family:var(--fd);text-transform:uppercase;font-size:18px;letter-spacing:.03em}
  .main{padding:18px 16px calc(100px + var(--sb))}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,9,.94);backdrop-filter:blur(14px);border-top:1px solid var(--linea);padding:8px 6px calc(8px + var(--sb))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--c3);text-decoration:none;padding:4px 0}
  .tabbar a.on{color:var(--oro)}
}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;margin-bottom:20px}
.hd h1{font-size:clamp(30px,4vw,44px)}
.hd p{color:var(--c3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--g1);border:1px solid var(--linea);border-radius:18px;padding:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpi small{color:var(--c3);font-weight:600;font-size:13px}
.kpi b{display:block;font-family:var(--fd);font-size:38px;line-height:1.05;margin-top:4px}
.kpi span{font-size:12.5px;color:var(--c3)}
.hero-card{border-radius:22px;padding:20px;background:linear-gradient(135deg,#2B2410,#121210 60%);border:1px solid rgba(226,183,70,.35);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:70;width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(var(--oro) calc(var(--p)*1%),#2C2A24 0);display:flex;align-items:center;justify-content:center}
.ring b{width:78px;height:78px;border-radius:50%;background:#15130E;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);font-size:30px;line-height:1}
.ring b small{font-family:var(--ft);font-size:10px;color:var(--c3);font-weight:700}
.list{display:grid;gap:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:14.5px}
.item small{color:var(--c3);font-size:12.5px}
.av{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--g3);color:var(--oro2);border:1px solid var(--linea)}
.av.lg{width:64px;height:64px;border-radius:18px;font-size:22px}
.bar{height:8px;border-radius:99px;background:#24221D;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--oro),var(--oro2))}
.areas{display:grid;gap:12px}
.areas .row{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13.5px}
.areas .row b{text-align:right}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--linea);flex:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check.on{background:var(--oro);border-color:var(--oro);color:#130F05}
.check svg{width:16px;height:16px;stroke-width:3;opacity:0}
.check.on svg{opacity:1}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;min-height:44px;border-radius:12px;border:1px solid var(--linea);background:var(--g1);padding:0 14px;font-size:15px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--linea);font-weight:700;font-size:13px;color:var(--c2)}
.chip[aria-pressed="true"]{background:var(--cal);color:var(--noche);border-color:var(--cal)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vthumb{position:relative;aspect-ratio:9/14;border-radius:14px;overflow:hidden;border:1px solid var(--linea);text-align:left}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 55%)}
.vthumb span{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;font-weight:700;font-size:13px}
.vthumb i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;width:52px;height:52px;box-shadow:0 0 0 6px rgba(226,183,70,.25),0 8px 22px rgba(0,0,0,.5);border-radius:50%;background:var(--oro);color:#130F05;display:flex;align-items:center;justify-content:center}
.week{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.day h4{font-family:var(--fd);text-transform:uppercase;font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between}
.ses{border-radius:14px;padding:12px;background:var(--g2);border:1px solid var(--linea);margin-bottom:8px;text-align:left;width:100%}
.ses b{display:block;font-size:14px}
.ses small{color:var(--c3);font-size:12px}
.ses .tag{display:inline-block;margin-top:6px}
@media (max-width:900px){.week{grid-template-columns:repeat(4,minmax(200px,1fr));overflow-x:auto;padding-bottom:8px}}
.empty{padding:26px;text-align:center;color:var(--c3)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--c3);font-weight:700;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--linea)}
td{padding:12px 10px;border-bottom:1px solid var(--linea)}
.tw{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}

/* ---------- Hojas ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .box{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--g1);border:1px solid var(--linea);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + var(--sb));transform:translateY(30px);transition:transform .25s}
.sheet.open .box{transform:none}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:24px}}
.sheet h2{font-size:28px;margin-bottom:4px}
.sheet .x{float:right;width:40px;height:40px;border-radius:12px;background:var(--g3);display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translate(-50%,20px);z-index:90;background:var(--cal);color:var(--noche);font-weight:700;padding:12px 18px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.paybtns button{min-height:64px;border-radius:14px;border:1px solid var(--linea);background:var(--noche);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.paybtns button[aria-pressed="true"]{border-color:var(--oro);background:rgba(226,183,70,.1)}
.paybtns small{font-weight:600;color:var(--c3);font-size:12px}
video.player{width:100%;max-height:70vh;border-radius:14px;background:#000}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seal img{background:#050505}
.posplan .obj{display:grid;grid-template-columns:1fr 46px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.posplan .obj:first-of-type{border-top:0}
.posplan .obj b{font-size:14.5px}
.posplan .obj small{grid-column:1/-1;color:var(--c3);font-size:12.5px;margin-top:-2px}
.posplan .obj em{font-style:normal;text-align:right;font-weight:700;color:var(--oro)}
.posplan .bar{grid-column:1/-1;height:6px;border-radius:9px;background:#2C2A24;overflow:hidden}
.posplan .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--oro-h,#B8861F),var(--oro))}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 14px}
.phases span{text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 4px;border-radius:10px;border:1px solid var(--linea);color:var(--c3)}
.phases span.on{border-color:var(--oro);color:var(--oro);background:rgba(226,183,70,.1)}
.krea-sig{margin:26px 0 6px;padding-top:14px;border-top:1px solid var(--linea);text-align:center;font-size:12px;color:var(--c3)}
.krea-sig b{color:var(--oro)}
@media (max-width:600px){
 .week{grid-template-columns:1fr !important;overflow:visible}
 .tw{overflow:visible}.tw table,.tw tbody{display:block}.tw thead{display:none}
 .tw tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--linea)}
 .tw td{padding:0;border:0}
 .tw td:nth-child(1){grid-column:1}.tw td:nth-child(4){grid-column:2;grid-row:1;align-self:center}
 .tw td:nth-child(2),.tw td:nth-child(3){display:inline;color:var(--c3);font-size:13px}
 .tw td:nth-child(5){grid-column:2;text-align:right}
 .tw td:nth-child(5):empty{display:none}
}
.vthumb i svg{width:22px !important;height:22px !important;margin-left:2px}
.av.ph{position:relative;padding:0;overflow:visible;background:linear-gradient(160deg,#2a2618,#14130f)}
.av.ph .pic{width:100%;height:100%;border-radius:inherit;overflow:hidden;display:block}
.av.ph .pic img,.av.ph .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.av.ph .pic svg{transform:scale(1.45) translateY(9%)}
.av.ph{width:46px;height:46px}.av.ph.lg{width:64px;height:64px}
.av.ph .ini{position:absolute;right:-5px;bottom:-5px;min-width:20px;height:20px;padding:0 4px;border-radius:7px;background:var(--oro);color:#130F05;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--g2,#111)}
.photo-slot{position:relative;width:118px;height:148px;border-radius:20px;flex:none;overflow:hidden;border:1.5px dashed rgba(226,183,70,.55);background:linear-gradient(160deg,#2a2618,#0f0e0b);cursor:pointer}
.photo-slot img,.photo-slot svg{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.has{border-style:solid;border-color:var(--oro)}
.photo-slot .cam{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:5px;height:28px;border-radius:9px;background:rgba(5,5,5,.75);backdrop-filter:blur(4px);font-size:10.5px;font-weight:800;color:var(--oro2);white-space:nowrap}
.photo-slot .cam svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.photo-slot .ini{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:8px;background:var(--oro);color:#130F05;font-size:11px;font-weight:800}
@media (max-width:600px){.photo-slot{width:96px;height:120px}}
.lib{margin-top:6px;border:1px solid var(--linea);border-radius:16px;overflow:hidden;background:var(--noche)}
.lib summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:800}
.lib summary::-webkit-details-marker{display:none}
.lib summary small{font-weight:600;color:var(--c3)}
.lib summary .chev{transition:transform .2s;color:var(--oro)}
.lib[open] summary .chev{transform:rotate(180deg)}
.lib .lbody{padding:0 12px 12px}
.lib .areas{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px}
.lib .areas::-webkit-scrollbar{display:none}
.lib .areas .chip{flex:none;min-height:34px;padding:0 12px;font-size:12.5px}
.lib .lsearch{width:100%;min-height:42px;border-radius:11px;border:1px solid var(--linea);background:#0b0b09;padding:0 12px;font-size:15px;margin-bottom:8px}
.lib .llist{max-height:300px;overflow:auto;display:grid;gap:6px;padding-right:2px}
.lex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--linea);background:var(--g2,#121210);text-align:left;width:100%}
.lex b{font-size:14px}.lex small{grid-column:1;color:var(--c3);font-size:12px;line-height:1.35}
.lex .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--oro2);margin-right:6px}
.lex .add{grid-column:2;grid-row:1/span 2;width:34px;height:34px;border-radius:50%;background:rgba(226,183,70,.14);border:1px solid rgba(226,183,70,.5);color:var(--oro2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.lex.on{border-color:var(--oro);background:rgba(226,183,70,.08)}.lex.on .add{background:var(--oro);color:#130F05}
.sel{display:grid;gap:6px;margin:6px 0 2px}
.sel .it{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:11px;background:rgba(226,183,70,.08);border:1px solid rgba(226,183,70,.35);font-size:13.5px;font-weight:700}

}

function lineChart(vals,labels){
  const w=520,h=170,p=28,max=100,min=30,step=(w-p*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[p+i*step,h-p-(v-min)/(max-min)*(h-p*2)]);
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución de la nota global: de ${vals[0]} a ${vals[vals.length-1]}">
  <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B746" stop-opacity=".35"/><stop offset="1" stop-color="#E2B746" stop-opacity="0"/></linearGradient></defs>
  ${[40,60,80].map(v=>{const y=h-p-(v-min)/(max-min)*(h-p*2);return `<line x1="${p}" x2="${w-p}" y1="${y}" y2="${y}" stroke="#2A2822"/><text x="4" y="${y+4}" fill="#9A9588" font-size="11">${v}</text>`}).join('')}
  <path d="${d} L${pts[pts.length-1][0]} ${h-p} L${p} ${h-p}Z" fill="url(#ga)"/>
  <path d="${d}" fill="none" stroke="#E2B746" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?'#F5CB64':'#15130E'}" stroke="#E2B746" stroke-width="2"/><text x="${q[0]}" y="${h-6}" fill="#9A9588" font-size="11" text-anchor="middle">${labels[i]}</text>`).join('')}
  </svg>`;
}

/* ---------- Míster: Hoy ---------- */
function vHoy(){
  const day=todayName();
  const groups=Object.entries(GROUPS).filter(([k,g])=>g.days.includes(day));
  const key=k=>day+'-'+k;
  const att=k=>S.attendance[key(k)]||[];
  const total=groups.reduce((a,[k])=>a+S.players.filter(p=>p.group===k).length,0);

function libFor(g,area,q){let L=allLib();if(area==='Del club')return ((S.customEx)||[]).filter(x=>(x.g==='all'||x.g===g)).filter(x=>!q||(x.n+' '+x.d).toLowerCase().includes(q.toLowerCase()));const c=CATL[g];if(c)L=L.filter(x=>x.own?(x.g==='all'||x.g===g):x.c.includes(c));else L=L.filter(x=>!x.own||x.g==='all'||x.g===g);if(g==='fis'&&area==='Todos')L=L.filter(x=>x.a==='Físico'||x.a==='Calentamiento');if(g==='por'&&area==='Todos')L=L.filter(x=>x.a==='Porteros');if(area!=='Todos')L=L.filter(x=>x.a===area);if(q)L=L.filter(x=>(x.n+' '+x.d).toLowerCase().includes(q.toLowerCase()));return L;}

  const [r,id]=(location.hash.replace('#/','')||'').split('/');

  const route=NAV[S.role].some(n=>n[0]===r)||r==='jugador'?r:def;
  const V={hoy:vHoy,jugadores:vJugadores,jugador:()=>vFicha(id),sesiones:vSesiones,pagos:vPagos,inicio:vInicio,progreso:vProgreso,tareas:vTareas,pack:vPack};

    $('#nf').onsubmit=ev=>{ev.preventDefault();const v=$('#nt').value.trim();if(!v){$('#nfe').textContent='Escribe el comentario.';return;}p.notes.unshift({t:v,by:S.me,d:todayName()});save();closeSheet();render();toast('Nota guardada');};}
  if(a==='newSession'){let sel=[],area='Todos',q='';setTimeout(()=>$('#sheetBox').classList.add('wide'));
    sheet(`<h2 class="disp">Planificar sesión</h2><p class="muted" style="margin-bottom:16px">Elige grupo y día, y añade ejercicios de la biblioteca con un toque.</p><form id="sf"><div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="f"><label for="sg">Grupo</label><select id="sg">${Object.entries(GROUPS).map(([k,g])=>`<option value="${k}">${g.name}</option>`).join('')}</select></div><div class="f"><label for="sd">Día</label><select id="sd">${DAYS.map(d=>`<option ${d===todayName()?'selected':''}>${d}</option>`).join('')}</select></div></div>
    <div class="f"><label>Ejercicios de la sesión</label><div class="sel" id="ssel"></div><p class="sel-sum" id="ssum"></p></div>
    <details class="lib" id="slib" open><summary><span>📚 Biblioteca de ejercicios <small id="scount"></small></span><span class="chev">▾</span></summary><div class="lbody"><div class="areas" id="sareas">${AREAS.map(x=>`<button type="button" class="chip" data-area="${x}" aria-pressed="${x==='Todos'}">${x}</button>`).join('')}</div><input class="lsearch" id="sq" placeholder="Buscar ejercicio" autocomplete="off"><button type="button" class="newex-btn" id="nxb">＋ Crear ejercicio y guardarlo en la biblioteca</button><div class="newex" id="nx" hidden><div class="f"><label for="nxn">Nombre del ejercicio</label><input id="nxn" placeholder="Ej.: Rondo 4x2 con salida en conducción"></div><div style="display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px"><div class="f"><label for="nxa">Área</label><select id="nxa">${AREAS.slice(2).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="f"><label for="nxm">Minutos</label><input id="nxm" inputmode="numeric" maxlength="2" value="10"></div></div><div class="f"><label for="nxd">Explicación breve (opcional)</label><input id="nxd" placeholder="Qué se trabaja y cómo"></div><div class="f"><label for="nxc">Para qué grupos</label><select id="nxc"><option value="g">Solo este grupo</option><option value="all">Todos los grupos</option></select></div><p class="muted" id="nxe" style="color:var(--bad);min-height:18px;font-size:13px"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn" id="nxx">Cancelar</button><button type="button" class="btn oro" id="nxs">Guardar en biblioteca</button></div></div><div class="llist" id="slist"></div></div></details>
    <div class="f" style="margin-top:14px"><label for="se">Notas o ejercicios propios</label><textarea id="se" placeholder="Uno por línea (opcional)"></textarea></div><button class="btn oro full">Guardar sesión</button></form>`);
    const draw=()=>{const g=$('#sg').value;const L=libFor(g,area,q);$('#scount').textContent=`· ${L.length} para ${GROUPS[g].short||GROUPS[g].name}`;
      $('#slist').innerHTML=L.map(x=>{const on=sel.includes(x.n);return `<button type="button" class="lex ${on?'on':''}" data-ex="${x.n.replace(/"/g,'&quot;')}"><b><span class="tag">${x.own?'★ Del club · ':''}${x.a}</span>${x.n}</b><small>${x.d?x.d+' · ':''}${x.m} min${x.own?' · Creado por míster '+x.by:''}</small><span class="add">${on?'✓':'+'}</span></button>`}).join('')||(area==='Del club'?'<p class="muted" style="padding:10px">Aún no hay ejercicios del club para este grupo. Pulsa «Crear ejercicio» para añadir el primero.</p>':'<p class="muted" style="padding:10px">No hay ejercicios con ese filtro.</p>');
      drawSel();};
    const drawSel=()=>{$('#ssel').innerHTML=sel.map((n,i)=>{const x=allLib().find(e=>e.n===n);return `<div class="it"><i>${i+1}</i><span>${n}</span><small>${x?x.m+' min':''}</small><button type="button" data-rm="${i}" aria-label="Quitar">✕</button></div>`}).join('')||'<p class="muted" style="font-size:13px">Aún no hay ejercicios. Tócalos en la biblioteca para añadirlos.</p>';
      const tot=sel.reduce((t,n)=>t+((allLib().find(e=>e.n===n)||{}).m||0),0);$('#ssum').textContent=sel.length?`${sel.length} ejercicios · ${tot} min de los 90 de la sesión`:'';};
    const load=()=>{sel=[...(planFor($('#sg').value,$('#sd').value)||[])];draw();};
    $('#sg').onchange=()=>{area='Todos';$$('#sareas .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.area==='Todos'));load();};$('#sd').onchange=load;
    $('#sareas').onclick=e=>{const b=e.target.closest('[data-area]');if(!b)return;area=b.dataset.area;$$('#sareas .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));draw();};
    $('#sq').oninput=e=>{q=e.target.value.trim();draw();};
    $('#nxb').onclick=()=>{$('#nx').hidden=false;$('#nxb').hidden=true;$('#nxn').focus();};
    $('#nxx').onclick=()=>{$('#nx').hidden=true;$('#nxb').hidden=false;$('#nxe').textContent='';};
    $('#nxs').onclick=()=>{const n=$('#nxn').value.trim(),mm=+$('#nxm').value||10;if(!n){$('#nxe').textContent='Escribe el nombre del ejercicio.';return;}if(allLib().some(x=>x.n.toLowerCase()===n.toLowerCase())){$('#nxe').textContent='Ya existe un ejercicio con ese nombre.';return;}
      const g=$('#sg').value;const cats=$('#nxc').value==='all'?'PBAIC':(CATL[g]||'PBAIC');
      S.customEx=S.customEx||[];S.customEx.unshift({a:$('#nxa').value,c:cats,m:Math.min(90,Math.max(1,mm)),n,d:$('#nxd').value.trim(),own:true,by:S.me||'',g:$('#nxc').value==='all'?'all':g});save();
      sel=[...sel,n];['#nxn','#nxd'].forEach(x=>$(x).value='');$('#nxm').value='10';$('#nx').hidden=true;$('#nxb').hidden=false;$('#nxe').textContent='';
      area='Del club';$$('#sareas .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.area===area));draw();toast('Ejercicio guardado en la biblioteca');};

    $('#slist').onclick=e=>{const b=e.target.closest('[data-ex]');if(!b)return;const n=b.dataset.ex;const on=!sel.includes(n);sel=on?[...sel,n]:sel.filter(x=>x!==n);b.classList.toggle('on',on);b.querySelector('.add').textContent=on?'✓':'+';drawSel();};
    $('#ssel').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;sel.splice(+b.dataset.rm,1);draw();};
    load();
    $('#sf').onsubmit=ev=>{ev.preventDefault();const extra=$('#se').value.split('\n').map(x=>x.trim()).filter(Boolean);const all=[...sel,...extra];if(!all.length){toast('Añade al menos un ejercicio');return;}S.plans=S.plans||{};S.plans[$('#sg').value+'|'+$('#sd').value]=all;save();closeSheet();render();toast('Sesión planificada');};}
  if(a==='newPlayer'){sheet(`<h2 class="disp">Nuevo jugador/a</h2><p class="muted" style="margin-bottom:16px">Se crea con el pack Inicio; la familia recibirá su acceso.</p><form id="pf"><div class="f"><label for="pn">Nombre y apellidos</label><input id="pn"></div><div class="f"><label for="pa">Edad</label><input id="pa" inputmode="numeric" maxlength="2"></div><div class="f"><label for="pg">Grupo</label><select id="pg">${Object.entries(GROUPS).map(([k,g])=>`<option value="${k}">${g.name}</option>`).join('')}</select></div><p id="pfe" class="muted" style="color:var(--bad);min-height:20px"></p><button class="btn oro full">Crear jugador</button></form>`);
    $('#pf').onsubmit=ev=>{ev.preventDefault();const n=$('#pn').value.trim(),ag=$('#pa').value.trim();if(!n){$('#pfe').textContent='Escribe el nombre.';return;}if(!/^\d{1,2}$/.test(ag)){$('#pfe').textContent='Escribe la edad en números.';return;}
      S.players.push({id:'j'+Date.now(),name:n,age:+ag,pos:'Por definir',group:$('#pg').value,pack:'Inicio',paid:false,att:100,sessions:0,areas:{'Técnica':50,'Físico':50,'Táctica':50,'Actitud':50},hist:[50,50,50,50,50,50],tasks:[],notes:[]});save();closeSheet();render();toast('Jugador creado');};}
  if(a==='pay'){const p=P(S.kid);let m='Tarjeta';sheet(`<h2 class="disp">Pagar pack ${p.pack}</h2><p class="muted">${PACKS[p.pack]} € · ${p.name}</p><div class="paybtns" role="group" aria-label="Forma de pago"><button aria-pressed="true" data-m="Tarjeta">Tarjeta<small>Visa, Mastercard</small></button><button aria-pressed="false" data-m="Bizum">Bizum<small>Desde tu móvil</small></button></div><button class="btn oro full" id="payGo">Pagar ${PACKS[p.pack]} €</button><p class="demo">Demostración: no se cobra nada. En la versión real se abre la pasarela de pago segura.</p>`);
    $$('.paybtns button').forEach(b=>b.onclick=()=>{m=b.dataset.m;$$('.paybtns button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
    $('#payGo').onclick=()=>{p.paid=true;save();closeSheet();render();toast(`Pago con ${m} completado`);};}
  if(a==='changePack'){const p=P(S.kid);p.pack=t.dataset.pack;p.paid=false;save();render();toast('Pack cambiado a '+t.dataset.pack);}
});

render();

document.addEventListener('change',e=>{const inp=e.target.closest('[data-photo]');if(!inp||!inp.files[0])return;const p=P(inp.dataset.photo);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const W=360,H=450,c=document.createElement('canvas');c.width=W;c.height=H;const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);p.photo=c.toDataURL('image/jpeg',.82);save();render();toast('Foto guardada');};im.src=fr.result;};fr.readAsDataURL(inp.files[0]);});
</script>
</body>
</html>
